# @package sam3
project: red_data_unified
session_dir: /gscratch/portia/eabe/data/Johnson_lab/Video_recordings/courtship/Session0/2025_10_20_13_20_04
bouts_csv: auto   # auto -> resolve canonical {dataset}_bout_summary.csv in the processed dir
out: auto   # auto -> <processed_dir>/sam3_masks
dataset: null            # null -> derive from session_dir (.../<dataset>/SessionN/<rec>)
num_animals: 2
limit: 0           # 0 = all bouts
bout_ids: ''       # '' = all; else comma-separated bout_idx
reuse_masks: true  # skip bouts whose sam3_masks.npz already exists
# Offload SAM3 per-frame outputs to CPU. This BOUNDS GPU memory at the cost of
# PCIe traffic on every frame -- it is a memory/speed trade, not a speed-up.
# Measured on Session0 bout 22 (1393 frames, chunk_len=1000): peak ~27 GB, and
# turning this OFF was 5% faster (3184s vs 3358s).
# SET IT BACK TO true on cards smaller than ~32 GB, or if chunk_len is raised:
# 27 GB is comfortable on the 46 GB L40S this was measured on and is not on,
# say, a 24 GB card.
lowmem: false
sam3_version: sam3.1
sam3_gpu: 0
# Standard per-bout SAM-mask QC overlay video (viz.views.maskvid): stacks the
# top `overlay_cams` cameras (by mask coverage) with fly0/fly1 masks colored, so
# every mask run ships a visual QC + identity-consistency check next to
# sam3_masks.npz. Runs as an isolated `python -m viz maskvid` subprocess (2-D
# masks -> no jax/mujoco). Set overlay: false to skip.
overlay: true
overlay_cams: 3
overlay_frames: 300
# End-of-bout self-repair: if a camera's masks are a geometric outlier (SAM3
# locked onto a reflection/shadow/wrong blob), re-segment that camera with a
# box prompt at the fly reprojected from the good cameras and keep it only if
# the reprojection residual clearly improves; else flag it in `suspect_cameras`
# in the npz. repair_resid_thresh = per-camera leave-one-out reprojection
# residual (px) above which a camera is an outlier (baseline ~10px; a mis-track
# is 100px+). Set repair_outliers: false to skip.
repair_outliers: true
repair_resid_thresh: 40.0
# Mid-bout GAP repair: cameras that MISSED a fly that was in frame. Distinct
# from repair_outliers above -- those masks are present but wrong, these are
# absent, and an absent camera scores a NaN leave-one-out residual so the
# outlier trigger never fires on it. Root cause: SAM3VideoTracker prompts at
# frame_index 0 and propagates 'forward' only, so a fly that walks into a
# camera's view mid-bout is never picked up there (Session0 bout 22: the
# female enters 4 cameras at t~1200/1393 and all 4 report 0% valid). The
# repair box-prompts at the reprojected position on an anchor frame where she
# IS in view and propagates BOTH directions, filling only the missing frames.
# Accepted on an ABSOLUTE reprojection residual, since there is no prior
# residual to improve on. Set repair_missing: false to skip.
repair_missing: true
repair_missing_min_frames: 30    # don't fire a GPU pass for a handful of frames
repair_missing_min_frac: 0.02    # ...and it must be >=2% of the bout
repair_missing_accept_resid: 25.0  # px; baseline good-camera residual is ~10px
gpus: null         # null/[] = use all visible GPUs (CUDA_VISIBLE_DEVICES, else
                   # torch.cuda.device_count()); a list like [0,1] overrides.
                   # >1 GPU -> bouts are fanned out one subprocess per GPU.
manifest_name: manifest.json   # internal: multi-GPU workers write per-GPU
                               # partials (manifest.gpu<id>.json); the parent
                               # merges them into manifest.json.
# torch.compile the multiplex backbones. Costs ~235s ONCE per process and then
# runs ~10% faster per frame, so it is a loss on short jobs and a win on long
# ones -- break-even is around 1400 frames, i.e. roughly one bout. Measured on
# bouts 4/19/25 in a single process: first bout 948s -> 1183s (the overhead),
# steady state 1.71 -> 1.54 s/frame.
# A single-bout benchmark shows this as 23% SLOWER and is misleading; the
# tracker is constructed once per process and reused across every bout it
# handles, so the overhead is paid once. Over the 119k-frame courtship set the
# 0.17 s/frame saving is ~5.6 GPU-hours.
# SET false for one-off/short runs (a handful of bouts), where it only costs.
sam3_compile: true
sam3_text: insect
sam3_checkpoint: null
# Long-bout chunking (bounds GPU memory): bouts > chunk_len frames are tracked
# in overlapping chunks (each session freed between chunks), with identity
# carried across a boundary by box-prompting the next chunk at the previous
# chunk's object bboxes + an overlap IoU match. ~2000+ frame bouts OOM a 44 GB
# card single-pass. chunk_len=0 disables (always single-pass).
chunk_len: 1000
chunk_overlap: 120
# JARVIS checkout that owns the projects/ directory (red_data_unified lives here,
# not in third_party/JARVIS-HybridNet). Set to null to fall back to the
# JARVIS_ROOT env var, then third_party/JARVIS-HybridNet (which has no
# red_data_unified project and will fail — always set one or the other).
jarvis_root: /mmfs1/gscratch/portia/eabe/Research/Github/JARVIS-HybridNet
