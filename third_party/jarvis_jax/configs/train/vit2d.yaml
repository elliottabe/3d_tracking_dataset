# @package train
lr: 1.0e-3
weight_decay: 0.05
warmup_steps: 100
total_steps: 30000
batch_size: 32
mask_weight: 0.0
mask_dilate: 0        # px dilation of the SAM mask before the containment penalty (edge slack for thin legs/wings outside the mask)
backbone_lr_mult: 0.1
seed: 0
# loop / launcher args:
base_batch: 64
lr_scaling: sqrt
save_every: 1000
eval_every: 2000    # mid-training val MPJPE cadence; the loop also always evals once at the end
smoke: false
num_workers: 8      # thread-pool workers for the data-loading `batches()` sample fetch (JPEG decode + mask npz load); GPU was data-starved at num_workers=1
# Warm-start fine-tune: path to a FINISHED run's `final/` model checkpoint
# dir (Orbax StandardCheckpointer.save layout -- what run_training writes at
# the end of training). '' (default) = off. When set, run_training loads
# ONLY the model weights from that dir into the freshly-built model (same
# arch/shape required), then proceeds with a FRESH optimizer + step 0 in
# THIS run's own (new) run_id/ckpt_dir -- it does NOT resume the source run's
# optimizer/step/LR-schedule position. Distinct from Orbax ckpt_dir resume
# (this run's OWN ckpt_dir, used to survive SLURM preempt+requeue of THIS
# fine-tune) -- resume beats warm_start on requeue; warm_start only seeds the
# very first launch.
warm_start: ''
# Mask-channel ablation (2026-08-31): when true, every dataset (train/val)
# is wrapped in jarvis_jax.data.mask_zero.ZeroMaskDataset, which zeroes the
# 4th (SAM-mask) input channel of every sample -- model stays in_ch=4
# (capacity fixed), only the mask's information is removed. Default false =
# unchanged behaviour. See
# .superpowers/sdd/2026-08-29-coarse-to-fine-3d/mask-channel-ablation.md
mask_ablation: false
# Recording whose val annotations form the per-cohort "female" MPJPE printed
# beside the full-val number at every eval. MUST exist in the root's val
# split: run_training raises otherwise (an empty cohort would otherwise report
# a perfect 0.000px -- the whole v12_bal_maskoff run did exactly that because
# this value was a hardcoded default and 2026_05_27_11_56_05 had been re-filed
# as 2026_04_02_12_11_50). On red_data_3d_v12_export0902 the pure-female val
# recording is 2026_06_09_15_46_55 (headless_22_50_female, 140 anns); the
# courtship val recordings 2026_04_02_12_11_50 / _15_25_51 hold BOTH sexes.
# Logging only -- does not change what is trained on.
val_recording: '2026_06_09_15_46_55'
# Center-channel (instance-cue) ablation arm: 4th input channel = a Gaussian
# at the TARGET fly's own bbox center, replacing the SAM mask, instead of
# zeroing it (mask_ablation above). Mutually exclusive with mask_ablation.
# See jarvis_jax/data/center_channel.py and train/train.py::TrainConfig.
# Replace the 4th input channel with a Gaussian at the target fly's OWN centre
# instead of its SAM mask (jarvis_jax.data.center_channel). KEEP FALSE.
#
# Measured 2026-08-31 on red_data_3d_v5_valfix, matched steps, val MPJPE
# overall / female (px):
#         step   4ch RGB+mask   3ch RGB     4ch RGB+centreG
#         2000   24.75 / 52.20  24.16/49.83  30.62 / 51.05
#         4000   12.30 / 37.99  12.34/35.64  18.91 / 45.14
#         6000    8.32 / 34.79   8.41/31.62  14.47 / 45.42
#         8000    6.78 / 28.82   6.66/23.32  12.08 / 36.02
# Killed at step 9400/30000: 1.81x worse than plain RGB and the gap was WIDENING
# (1.27x at step 2000 -> 1.81x at 8000), so it was not a slow start.
#
# It loses even though it is handed the GROUND-TRUTH centre at both train and
# eval time -- this is the idea's best case, and a real CenterDetect centre
# (which misses a wall-adjacent fly entirely) could only be worse.
#
# Read together with the mask ablation, whose winner is 3-channel RGB
# (5.28px overall / 9.74px female, vs 5.49 / 18.72 with the mask channel):
# NEITHER extra channel earns its place. Feed the detector RGB.
center_channel_input: false
# Gaussian target sigma in heatmap px. MUST STAY 7.0: the 2026-08-29
# resolution analysis argued for 2.0 and the 2026-08-30 retrain measured a 6.5x
# regression (6.448 px -> 55.528 px val MPJPE, identical data/sampling/aug).
# sigma sets the optimisation basin, not the resolution ceiling -- full
# derivation and refutation in data/transforms.py:gaussian_heatmaps.
target_sigma: 7.0

# ---- Distractor-aware supervision (2026-09-03; jarvis_jax/data/distractor.py,
# docs/benchmark/2026-09-03-maskoff-attention/notes.md). Motivation: the v12
# mask-off detector's tarsal-tip misses fire on the OTHER fly's leg tips and on
# floor reflections while the true tip responds at 0.31 of the max; attention is
# identical to a checkpoint that gets them right, so the fix is in the
# supervision, not the backbone. All four default OFF = legacy stream + loss.
# Hard-negative background: MSE over the `hardneg_k` worst background pixels
# per channel, added at `hardneg_weight`. The plain bg term averages over
# ~50k px at 0.1, so a confident wrong blob is ~free without this. Unswept
# starting point for the A/B arm: k=256 (a sigma-7 blob's core), weight 0.5.
hardneg_k: 0
hardneg_weight: 0.0
# Repulsion at the other fly's SAME-PART keypoints (every TaTip vs my TaTip
# channel, etc.), own foreground excluded. 1.0 = a spurious peak on the other
# fly costs as much as missing one's own. Wraps train in
# DistractorKeypointDataset (rows [K:] = other fly), val untouched.
repulsion_weight: 0.0
# Gray-fill the other fly's SAM BODY mask with this probability per draw,
# exactly as predict_2d/session_frameset do at inference (training never did;
# measured 2026-09-03: v12 male 16.9 -> 15.2 px under the OOD fill). <1 keeps
# raw two-fly crops in the stream so the model also copes with missing masks.
# The fill leaves the other fly's LEGS visible (mask = body silhouette).
distractor_fill_p: 0.0
# Copy-paste a same-camera donor fly into a single-fly frame with this
# probability (CopyPasteKeypointDataset). Train is 1.7% two-fly images vs 32%
# of val; this closes that gap with exact donor keypoints for the repulsion.
copy_paste_p: 0.0
