# @package train
lr: 1.0e-3
weight_decay: 0.05
warmup_steps: 100
total_steps: 30000
batch_size: 32
mask_weight: 0.0
mask_dilate: 0        # px dilation of the SAM mask before the containment penalty (edge slack for thin legs/wings outside the mask)
backbone_lr_mult: 0.1
seed: 0
# loop / launcher args:
base_batch: 64
lr_scaling: sqrt
save_every: 1000
eval_every: 2000    # mid-training val MPJPE cadence; the loop also always evals once at the end
smoke: false
num_workers: 8      # thread-pool workers for the data-loading `batches()` sample fetch (JPEG decode + mask npz load); GPU was data-starved at num_workers=1
