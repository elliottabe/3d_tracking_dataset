# @package model
# Composes the SHARED ViT (model/vitpose.yaml) + v2vnet into the 3D HybridNet,
# so the ViT architecture lives in exactly one place.
# Packaging note: vitpose.yaml declares `# @package model` (so `model=vitpose`
# lands its fields at cfg.model.* for 2D training). The `@vitpose` target below
# overrides that, mounting the SAME file at cfg.model.vitpose.* here. One file
# serves both: flat at model.* standalone, nested at model.vitpose.* when composed.
defaults:
  - /model/vitpose@vitpose
  - /model/v2vnet@v2vnet
  - _self_

roi_cube: 48
grid_spacing: 1
num_cameras: 7
sharpen: 3.0

# Stage-2 per-joint refinement. cube*spacing*2 = +/-3 world units of capture,
# against a ~1-unit stage-1 error. 1 voxel ~ 0.8 heatmap px at spacing 0.25.
refine:
  enabled: true
  cube: 24
  spacing: 0.25
  channels: 32
  sharpen: 3.0
