defaults:
  - _self_
  - paths: hyak
  - model: hybridnet
  - data: v3
  - cache: default
  - train: cached3d
  - slurm: ckpt_g2
  - viz: default
  - predict: default
  - sam3: default
  - predict_session: default

run_id: run
note: ''

hydra:
  run:
    dir: ${paths.runs_root}/${run_id}
  job:
    config:
      override_dirname:
        exclude_keys: [paths, slurm, run_id, note]
