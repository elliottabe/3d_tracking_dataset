# Exact package versions verified in the working `3d_tracking` conda env on
# Hyak, 2026-09-06 (`conda list` / `pip list` in the env). Not a full
# `conda env export` dump -- filtered to the packages this repo's code
# actually imports, so it stays reviewable. Neither environment.yml nor
# requirements.txt pins these; this file is the record of what was verified
# to work together. See docs/running_the_pipeline.md ("Install and run on a
# new cluster") for how it fits into the install sequence.
#
# The one known mismatch: environment.yml pins numpy=2.2.6, but requirements.txt's
# unpinned deps (mujoco, jax[cuda12], etc., installed after via uv) pulled
# numpy up to 2.5.1 in this env. That drift is real and untested against
# 2.2.6 -- if you hit numpy issues, this is the version that is actually
# verified working.
name: 3d_tracking
python: 3.12.13
pip:
  # JAX ecosystem -- jax 0.11.x REQUIRES flax>=0.12.8; an older flax breaks
  # every import in this repo (jax_dataclasses/jaxls/mvq model code all hit
  # it at import time, not lazily).
  jax: 0.11.0
  jaxlib: 0.11.0        # cuda12 wheel; installed via jax[cuda12]
  flax: 0.12.8
  optax: 0.2.8
  orbax-checkpoint: 0.11.33
  chex: 0.1.91
  jaxopt: 0.8.5
  jaxlie: 1.5.0
  jaxls: 0.0.0           # jaxls reports version 0.0.0; installed from PyPI, not a git pin
  jax_dataclasses: 1.6.3
  jax-tqdm: 0.4.0
  jaxtyping: 0.3.9
  brax: 0.14.2
  # MuJoCo / sim
  mujoco: 3.11.0
  mujoco-mjx: 3.11.0
  mujoco-warp: 3.11.0
  warp-lang: 1.16.0
  # Torch + vision (SAM3 stage)
  torch: 2.11.0          # +cu130 build; torch.version.cuda == 13.0
  torchvision: 0.26.0
  transformers: 5.16.1
  huggingface_hub: 1.21.0
  # Data / config
  numpy: 2.5.1            # see mismatch note above -- environment.yml pins 2.2.6
  opencv-python: 4.13.0
  hydra-core: 1.3.2
  omegaconf: 2.3.0
  h5py: 3.16.0
  scikit-learn: 1.8.0
