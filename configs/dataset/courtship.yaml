# @package _global_.dataset

# Pure dataset definition. Multi-fly preprocessing cleanup and the shorter STAC
# clips live in the step variants preprocessing/courtship.yaml and stac/courtship.yaml.
defaults:
  - /preprocessing: courtship
  - /postprocessing: default
  - /stac: courtship

name: courtship
env_name: courtship
version: Data_analysis
train: True

concat:
  input_pattern: 'postprocessing/ik_output_${anatomy.name}_${dataset.name}*.h5'
  output_file: 'ik_output_combined_${anatomy.name}_${dataset.name}.h5'
  enable_jax: True
