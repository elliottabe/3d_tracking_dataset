# @package _global_.dataset

defaults:
  - /preprocessing: default
  - /postprocessing: default
  - /stac: default

name: BDN2_headless
env_name: BDN2_headless
version: Data_analysis
train: True

concat:
  input_pattern: 'postprocessing/ik_output_${anatomy.name}_${dataset.name}.h5'
  output_file: 'ik_output_combined_${anatomy.name}_${dataset.name}.h5'
  enable_jax: True

# Headless condition: exclude the (missing/unreliable) head and wing keypoints
# from the Procrustes alignment fit. Glob patterns over keypoint names; presence
# of `exclude` replaces the anatomy default. Excluded keypoints are still
# transformed by the computed alignment, just not used to compute it.
alignment:
  exclude: ['Antenna*', 'Eye*', 'WingL*', 'WingR*']