# IK / FK model inputs and the model->mm bridge.
#
# Was configs/silhouette/default.yaml. The silhouette polish it was named for
# is gone (dead: silhouette_weight and containment_weight both shipped 0.0, so
# the stage early-returned the STAC pose unchanged -- measured maxabsdiff 0.0
# against stac_ik.h5 on both flies of Session0 bout 28). What survived is what
# was always actually load-bearing: the model XML, the mesh used for FK/render,
# and the per-frame model->mm bridge.
#
# Deleted with the polish -- do not reintroduce without the cost stack:
#   silhouette_weight, containment_weight, refine_steps, refine_lr,
#   anchor_weight, erode_px, n_points, sdf_hw, bbox_margin, margin,
#   appendage_include, optimizer

xml: ${anatomy.mjcf_path}
mesh_npz: ${anatomy.cse_mesh_npz}
mesh_subset: fps_300

# 'keypoint' -- per-frame Umeyama(FK sites, kp3d) similarity; needs >=3 valid
#              keypoints and reads NO masks. The default: measured far better
#              IK reprojection than 'mask', whose centroid anchor was the cause
#              of the bad courtship fits.
# 'mask'     -- fixed s=1/kp_scale, translation from the triangulated SAM mask
#              centroid. Only for when the 2D keypoints are unusable.
bridge_mode: keypoint

# jaxls solve controls (still live: used by the Stage-C STAC path).
limit_weight: 10.0
smooth_weight: 0.005
n_iter: 50
beta: 8.0
huber_delta: 0.0
cg_tolerance_max: 1.0e-2
cg_tolerance_min: 1.0e-7
