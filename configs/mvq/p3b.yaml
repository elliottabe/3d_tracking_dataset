# @package mvq
# The P3b contact-heavy typed-slot mvq lifter (docs/benchmark/2026-09-mvq/p3b-notes.md).
# Warm-started from the jitter-10 checkpoint with heavier copy-paste contact,
# female_host_weight=4.27 and other_fly_repulsion=0.5 to attack the male-instance
# identity leak onto the female in contact frames. Accepted 2026-09-05: centre-shift
# gate PASS (0.0825mm at 1mm shift vs 0.0928mm line, miss 0.0), and the r2-lift
# re-lift of bouts 1/4/28 shows pose-jump frac drop to 0.0000 in all three
# (0.0448/0.0279/0.0000 -> 0/0/0) even with containment off -- a model-level fix,
# not just the containment filter. See p3b-notes.md for the full acceptance table.
#
# Selected with `pipeline.lifter=mvq mvq=p3b`. With that pair set, run_bout.py
# does NOT run Stages A/B (ViTPose 2D + DLT triangulation): `scripts/
# mvq_lift_bout.py` has already written kp2d.npz/kp3d.npz into the bout dirs,
# and Stage B's staleness check reads the `gates` string those files carry --
# `stage_b_gate_signature` returns `mvq_gate_string(checkpoint, step,
# exist_thresh)` here, so a run pointed at DIFFERENT weights refuses the bout
# rather than silently reusing it.
#
# `checkpoint` is a `final/` dir, so `step` is null. To pin an intermediate
# save instead, set `checkpoint` to the RUN dir and `step` to a CONCRETE int:
# "latest" is refused by name (it names a different step every time the
# training job saves, so a gate signature built from it would compare EQUAL to
# a kp3d.npz produced by different weights).
checkpoint: /gscratch/portia/eabe/data/Johnson_lab/jax_mvq_runs/mvq_t1_b16_p3b_contact_20260905/final
step: null

# Existence threshold for a typed slot. Below it the fly's frame is NaN rather
# than falling back to an untyped slot -- a frame reported as "the female" is
# never quietly some other slot. Enrolled in the gate signature because it
# decides WHICH FRAMES ARE NaN in kp3d.npz.
exist_thresh: 0.5

# WHO each written fly is.
#
#   mask  fly0 is SAM3 mask fly 0 and fly1 is mask fly 1 -- the HUMAN id
#         review the canonicalized masks carry, which is the top of this
#         pipeline's identity precedence (sexing.canonicalize_bout: human >
#         mvq > wing-song CV). Per frame the mvq instance nearest each mask's
#         triangulated centre is written as that fly; the model's sex head is
#         recorded but does not decide.
#   sex   fly0 is the model's FEMALE typed slot and fly1 its MALE one, each
#         from whichever window reads it most confidently. The original P3a
#         behaviour.
#
# `mask` because the sex head is measurably wrong on 2025_10_20_13_20_04: it
# types that female as a male, which NaN'd fly0 on 40% of the recording's
# frames (97.7% of bout 25) and let the male track jump onto her body on 2.5%
# of them (21% in bout 25). See
# `.superpowers/sdd/2026-09-04-mvq-maskfree-p4a-p4b/female-miss-diagnosis.md`
# and `docs/benchmark/2026-09-mvq/p3a-notes.md`. Enrolled in the gate
# signature: the two modes write DIFFERENT keypoints, so a run switched
# between them must not reuse the other's bouts.
identity: mask

# Per-keypoint MASK-CONTAINMENT filter, applied after the identity assignment
# and before the write: a keypoint that reprojects INSIDE the other fly's SAM
# mask and OUTSIDE its own (dilated by containment_own_margin_px) in at least
# containment_min_views of the cameras where BOTH masks are valid is NaN'd,
# along with its kp2d in every view and its confidence.
#
# WHY, measured on the 30-bout r2 lift of 2025_10_20_13_20_04. Identity is
# decided per FRAME, and the collapse guard is a per-frame test, so neither
# can see the failure that is left: in contact frames -- 264 of the 391
# pose-jump frames have the FEMALE's slot empty -- the male instance absorbs
# PART of her body. 1.4% of frames have >= 5 male keypoints stepping > 0.5 mm
# in one frame, 1.7% have >= 5 nearer her centroid than his, and it
# concentrates in bouts 19/10/16/1/30/8/4 (3-7% of their frames): bout 1 frame
# 364 puts 17 male keypoints (T1 legs, trochanters) on the female, bout 3
# frame 56 puts 26 (WingL_base, Antenna_Base, EyeL, T1 legs). The instance is
# mostly correct, so NaN-ing the whole frame would throw away a good male --
# only those keypoints go.
#
# Being OUTSIDE its own mask is never on its own a reason to drop: legs extend
# past a SAM mask and occluded parts project outside it. The filter fires only
# on the conjunction, and the own mask is dilated first, so it errs toward
# keeping.
#
# YAML note: quoted, because PyYAML resolves a bare `on` to the boolean True.
# Both are accepted (`resolved_containment`).
#
# Enrolled in the gate signature (it DELETES keypoints from kp3d.npz, so a
# filtered and an unfiltered lift are different files). Effective only under
# identity: mask -- it needs the masks' human id review to know whose body is
# whose -- and gated as false wherever that falls back to the sex head.
containment: "on"

# The filter's thresholds. Recorded in mvq_meta.json, NOT enrolled in the gate
# signature: re-tuning one must not charge a 12-minute STAC re-solve per
# bout-fly on every sweep point (the same choice made for collapse_dist_units
# and the mask-assignment margins).
#
#   min_views 3      of the 7 cameras, typically 3-5 have BOTH masks valid on
#                    20_04; 3 is a majority of that and no single bad SAM mask
#                    can reach it.
#   own_margin 6 px  SAM's fly masks sit ~2-5 px inside the silhouette here,
#                    and a tarsus one leg segment past the mask edge must not
#                    read as "outside its own mask".
#   max_step 5 units 0.5 mm in 1/800 s == 400 mm/s for ONE landmark. Above it
#                    the keypoint is SUSPECT in both frames of the pair, and
#                    dropped only if it also fails containment in either, or
#                    the step is above 2x this (a pure spike).
containment_min_views: 3
containment_own_margin_px: 6.0
containment_max_step_units: 5.0

# WHICH WINDOW a fly is read from when several hold it.
#
# A frame with two separated masks plans two 448-px crops, one per mask, and at
# courtship distances both usually contain BOTH animals. `any` (the rule before
# 2026-09-05) took each fly from whichever window read it most confidently --
# routinely the PARTNER's crop. The 3D is the same animal and the IK fits it,
# but half its body then sits at or past that crop's edge, so the per-view
# visibilities are ~0 and `conf3d` (their mean) collapses with them. Bout 10 of
# Session1/2026_04_02_14_54_28 read the female out of the male's window on
# 293/303 frames: head/thorax conf3d 0.10 there vs 0.71 from her own window,
# and across 12 sampled p3b bouts 7 female tracks sat at <= 0.4 while the male
# read ~0.99.
#
# That matters because conf3d is a GATE: the offsets sampler needs min conf
# >= 0.7, the rigid-edge repair 0.5, the side-by-side display hides low-conf 2D
# points ("half the fly disappears"), and the pseudo-label export thresholds on
# it. `own` consults the window centred on the fly's own mask FIRST and only
# falls back to the others when its own has no candidate passing exist_thresh
# and the mask test -- a preference, never a filter, and a no-op on a merged
# window (which is both flies' own).
#
# Enrolled in the gate signature: conf3d is written into kp3d.npz, so a lift
# under `own` and one under `any` are different files. Adding the key at all
# makes every pre-2026-09-05 lift stale, which is the point.
window_pref: own

# Windows per forward. The 448-crop x 7-camera DINOv3-B forward is the cost
# here; 8 fits comfortably on a 48 GB card at XLA_PYTHON_CLIENT_MEM_FRACTION
# 0.9 alongside the mask store. NOT part of the gate signature (batching
# cannot change the result -- short batches are padded and the padding
# dropped).
batch: 8

# Two flies whose 3D mask centroids are within this many world units (30 ==
# 3 mm) share ONE crop, which is the model's own two-instance case. Same rule
# and same default as the coarse pass (coarse_centres.plan_windows).
merge_dist_units: 30.0

# null keeps the checkpoint's own attention implementation (cudnn for this
# run). Set "xla" to run these weights on a CPU.
attn_impl: null
