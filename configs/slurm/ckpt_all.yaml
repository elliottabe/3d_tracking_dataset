# @package slurm
# ckpt-all widens the eligible pool beyond ckpt-g2 (l40/l40s/h200) by adding
# the a40 (32 nodes) and a100 (8) pools -- roughly double the nodes, which
# matters most when the queue is the bottleneck rather than the GPU.
#
# The constraint EXCLUDES GPUs too small for this model, which ckpt-all
# otherwise includes: rtx6k 24GB, 2080ti 11GB, p100 16GB, plus the CPU-only
# n[...] nodes. Ordered biggest/fastest first for readability; slurm treats
# an OR constraint as a set, not a preference.
#   h200  141GB HBM3e ~4.8TB/s   a100 40/80GB HBM2e ~1.5-2TB/s
#   l40s  48GB GDDR6  ~0.86TB/s  l40  48GB GDDR6 ~0.86TB/s
#   a40   48GB GDDR6  ~0.70TB/s  (slowest usable)
partition: ckpt-all
constraint: 'h200|a100|l40s|l40|a40'
account: portia
gpus_per_task: 1
cpus: 8
# 48 -> 64: v1's three >= 2100-frame bouts peaked at 50.3 GB (MaxRSS =
# 0.0197*T + 7.9 GB) against a 48 GB request, and only survived because this
# cluster does not hard-enforce the cgroup limit. build_precompute_script /
# build_jax_array_script / build_aggregate_script (scripts/slurm_bout_array.py)
# all read this SAME `slurm.mem` field -- one value, no separate precompute knob.
mem: 64
time: '12:00:00'
requeue: true
conda_env: 3d_tracking
mail_user: ${oc.env:USER,eabe}@uw.edu
