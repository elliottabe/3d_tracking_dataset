# @package detector
# Retrained on red_data_unified_V4 (2026-08-08). Validated on 3 bouts against
# v4_kp_maskaware_fc with stop_after=triangulate: median within-bone CV 9.91%
# -> 4.36% over 6 bout-flies, better in 5 of 6, conf3d 0.899 -> 0.934. The
# headline case (15_25_51 b8 fly0, 298.96% -> 4.62%) was confirmed visually --
# the old checkpoint scattered keypoints into empty space at confidence
# 0.60-0.66. Reproduce the side-by-side overlay with
# scripts/viz/compare_detectors.py (its PNGs are untracked artifacts).
# KNOWN WEAKNESS: on frames where the two flies OVERLAP it is ~6% worse (and
# 41% better when they are apart); 92% of the frames it loses are
# close-interaction. Cause is the JAX port omitting JARVIS's distractor-fly
# RGB gray-fill, not this checkpoint.
ckpt: ${paths.vit_runs_root}/v4_8gpu_20260808/final
num_keypoints: 50
crop: 448
heatmap_size: 224
conf_thresh: 0.3      # min 2D peak conf for a KEYPOINT to enter triangulation
# Min MEDIAN keypoint confidence for a whole (frame, camera) view to enter
# triangulation. null = off. conf_thresh alone cannot reject a crop that
# contains no fly: the detector fills all 50 channels regardless and reports
# high per-keypoint confidence doing it, so a misplaced crop yields a
# confident WRONG 3D point -- worse than a dropped view, because a NaN is
# visibly missing downstream and a plausible wrong point is not.
# Calibrated on 273 real views per class (scripts/calibrate_view_gate.py):
# per-view median conf is 0.963 with a fly present vs 0.379 without, so 0.6
# keeps 100% of genuine views and rejects ~92% of empty ones. Raising it to
# 0.8 buys no extra rejection and starts costing real views. Not a cure: ~5%
# of empty crops still score above 0.9.
view_conf_thresh: 0.6
# Reprojection-residual consensus gate for single-view 2D leg swaps -- the
# failure neither threshold above can see: one camera's tarsal tip jumps to
# the wrong leg at conf 0.4-0.8 ("confidently wrong") and drags the DLT,
# producing the 3D jitter spikes measured in
# docs/benchmark/2026-08-14-jax-vs-jarvis-stability/notes.md. This value is
# the consensus INLIER BAND in px; a point is re-solved from its largest
# self-consistent view set only when some view is 3x this inconsistent
# (triangulate.TRIGGER_FACTOR -- gross swaps are 100-400 px; diffuse noise on
# hard wall/occlusion poses must NOT trigger or the winning view-subset
# churns frame to frame, measured +80% spikes on benchmark b12-fly1), and
# only when >= 3 views survive (2-view consensus locked onto the wrong
# cluster on female b8: +25% spikes). null = off (byte-identical to the
# pre-feature pipeline). Enabled at 10 px from the 2026-08-14 benchmark A/B
# (dlt_robust_t30 vs dlt_plain, full STAC scorecards): female soft-IoU +46%
# and close-frame reproj -38%, spike rate free-running -56% / male -23% /
# female -14%, every other cohort metric within a few %; 3/21 bout-flies
# regress >5%, all small or on bouts whose 2D is broken upstream (wall-edge
# OOD poses). Session6 clip: 834 -> 515 accel spikes.
reproj_resid_px: 10.0
decode_sharpen: 3.0   # soft-argmax sharpening power; 1.0 = original centroid.
                      # Set from the Task-4 wobble diagnostic (mean wobble soft
                      # s1=0.727 -> s3=0.573 px); matches the repo's existing
                      # 3D-path sharpen=3.0.

# Detector output channel order (order "O"): the tracking/COCO training order the
# retrained ViTPose (v3_kp_maskaware, trained on red_data_unified_V3) emits. This
# DIFFERS from cfg.model.KP_NAMES (XML site order) used by triangulation/STAC/IK,
# so the pipeline reorders detector output -> model order (reorder_detector_to_model).
# Provenance: read from the tracking CSV header (data3D_fly0.csv) and VERIFIED by
# remapping red_data GT -> correct anatomy (eyes on eyes, abd on abdomen, leg=leg).
# All-left-legs (T1L,T2L,T3L) then all-right-legs (T1R,T2R,T3R).
kp_names:
  - Antenna_Base
  - EyeL
  - EyeR
  - Scutellum
  - Abd_A4
  - Abd_tip
  - WingL_base
  - WingL_V12
  - WingL_V13
  - T1L_ThxCx
  - T1L_Tro
  - T1L_FeTi
  - T1L_TiTa
  - T1L_TaT1
  - T1L_TaT3
  - T1L_TaTip
  - T2L_Tro
  - T2L_FeTi
  - T2L_TiTa
  - T2L_TaT1
  - T2L_TaT3
  - T2L_TaTip
  - T3L_Tro
  - T3L_FeTi
  - T3L_TiTa
  - T3L_TaT1
  - T3L_TaT3
  - T3L_TaTip
  - WingR_base
  - WingR_V12
  - WingR_V13
  - T1R_ThxCx
  - T1R_Tro
  - T1R_FeTi
  - T1R_TiTa
  - T1R_TaT1
  - T1R_TaT3
  - T1R_TaTip
  - T2R_Tro
  - T2R_FeTi
  - T2R_TiTa
  - T2R_TaT1
  - T2R_TaT3
  - T2R_TaTip
  - T3R_Tro
  - T3R_FeTi
  - T3R_TiTa
  - T3R_TaT1
  - T3R_TaT3
  - T3R_TaTip

kp2d_filter:
  enabled: false          # flip true after the wobble diagnostic confirms it helps
  min_cutoff: 1.0         # lower -> stronger smoothing when the joint is still
  beta: 0.5               # higher -> less smoothing (less lag) when moving fast
  d_cutoff: 1.0
  preserve_raw_patterns: [Wing]

# Per-(camera,keypoint) displacement gate: drops (zeroes the confidence of) a
# frame whose raw 2D position hops further than that keypoint's own
# threshold from the immediately preceding CONFIDENT frame. Targets a
# correlated camera-majority landmark flip (WingL_V13, Session0
# 2025_10_20_13_20_04 bout 28: alternates between two real-but-wrong visible
# wing structures at conf 0.91-0.94) that conf_thresh/view_conf_thresh
# (both candidates score high), reproj_resid_px (the majority IS wrong, so
# there's no minority view to reject) and kp2d_filter (1-Euro's speed
# adaptivity reads the jump as fast real motion) all measurably fail to
# catch. See jarvis_jax.tracking.kp2d_displacement_gate's module docstring
# and .superpowers/sdd/2026-08-29-coarse-to-fine-3d/displacement-gate.md.
#
# LIMITATION (read before enabling on a new bout/rig): this is a
# magnitude-only gate. It suppresses the artifact only because ITS hop
# (measured 120-330px) exceeds this bout's largest confirmed real wing
# displacement (~130px) -- a motion-energy check run alongside this
# measurement does NOT separate real vs. artifact jumps at matched
# displacement (AUC 0.473, chance). A same-pixel-scale confusion on a
# different bout/keypoint would pass straight through. Validated on ONE
# bout, ONE fly's ground truth: 82.5% artifact suppression, 100.0%
# real-motion preservation across 5 confirmed real windows. Default-off.
kp2d_displacement_gate:
  enabled: false
  # Fallback threshold (px) for any keypoint not listed below. Derived from
  # fly1 (male)'s own bout-28 frame-to-frame displacement distribution
  # (p99.5, pooled over confident/consecutive frames, all 7 cameras) x1.2
  # safety margin, floored at 40px -- see displacement-gate.md for the full
  # per-keypoint table and derivation. 46/50 keypoints land on this floor;
  # only wing tips and the fastest distal-tarsus points need a higher value.
  default_px: 40.0
  per_keypoint_px:
    WingL_V12: 188.5
    WingL_V13: 152.4     # the calibration keypoint (p99.5=127.0px, matches
                          # wing-gating.md's independently-measured ~130px
                          # real-motion ceiling almost exactly)
    WingR_V13: 64.7
    T1R_TaT3: 45.3
    T1R_TaTip: 77.6
    T2L_TaTip: 60.9
    T2R_TaTip: 59.2

# Dilate the distractor-fly mask (px) before gray-filling it out of the crop,
# and dilate the target mask by the same amount when excluding it so the
# target's own limbs are never filled. A SAM3 mask is the BODY silhouette: the
# legs/wings/antennae fall outside it and survived the fill, leaving a
# fly-shaped object the detector prefers whenever the real target is small or
# edge-on. Measured on Session0/2025_10_20_13_20_04 bout_00028: with 0, the
# female's keypoints land on the male in 87-100% of frames during the stretch
# where she is against the wall, on cameras where her own mask is 100% valid.
# 15 px closes the limbs into the blob without bloating it (swept 0/9/15/25/40).
distractor_dilate: 15

# Radius (px) protecting the TARGET from the distractor fill. Must exceed
# distractor_dilate: the target's wings also lie outside its mask, and an
# extended wing reaches far past the body -- straight at the other fly. With a
# symmetric 15/15 the target's own wing tip was erased in 24.2% of views on
# bout_00028 (12.1% undilated), and wing L/R identity flipped on 5.71% of
# adjacent frames vs 3.33% before. 60 brings that to 7.4% -- better than the
# undilated original -- while the fill still covers 1.65x the undilated area.
target_protect: 60
