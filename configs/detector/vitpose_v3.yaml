# @package detector
ckpt: ${paths.vit_runs_root}/v4_kp_maskaware_fc/final
num_keypoints: 50
crop: 448
heatmap_size: 224
conf_thresh: 0.3      # min 2D peak conf for a view to enter triangulation
decode_sharpen: 3.0   # soft-argmax sharpening power; 1.0 = original centroid.
                      # Set from the Task-4 wobble diagnostic (mean wobble soft
                      # s1=0.727 -> s3=0.573 px); matches the repo's existing
                      # 3D-path sharpen=3.0.

# Detector output channel order (order "O"): the tracking/COCO training order the
# retrained ViTPose (v3_kp_maskaware, trained on red_data_unified_V3) emits. This
# DIFFERS from cfg.model.KP_NAMES (XML site order) used by triangulation/STAC/IK,
# so the pipeline reorders detector output -> model order (reorder_detector_to_model).
# Provenance: read from the tracking CSV header (data3D_fly0.csv) and VERIFIED by
# remapping red_data GT -> correct anatomy (eyes on eyes, abd on abdomen, leg=leg).
# All-left-legs (T1L,T2L,T3L) then all-right-legs (T1R,T2R,T3R).
kp_names:
  - Antenna_Base
  - EyeL
  - EyeR
  - Scutellum
  - Abd_A4
  - Abd_tip
  - WingL_base
  - WingL_V12
  - WingL_V13
  - T1L_ThxCx
  - T1L_Tro
  - T1L_FeTi
  - T1L_TiTa
  - T1L_TaT1
  - T1L_TaT3
  - T1L_TaTip
  - T2L_Tro
  - T2L_FeTi
  - T2L_TiTa
  - T2L_TaT1
  - T2L_TaT3
  - T2L_TaTip
  - T3L_Tro
  - T3L_FeTi
  - T3L_TiTa
  - T3L_TaT1
  - T3L_TaT3
  - T3L_TaTip
  - WingR_base
  - WingR_V12
  - WingR_V13
  - T1R_ThxCx
  - T1R_Tro
  - T1R_FeTi
  - T1R_TiTa
  - T1R_TaT1
  - T1R_TaT3
  - T1R_TaTip
  - T2R_Tro
  - T2R_FeTi
  - T2R_TiTa
  - T2R_TaT1
  - T2R_TaT3
  - T2R_TaTip
  - T3R_Tro
  - T3R_FeTi
  - T3R_TiTa
  - T3R_TaT1
  - T3R_TaT3
  - T3R_TaTip

kp2d_filter:
  enabled: false          # flip true after the wobble diagnostic confirms it helps
  min_cutoff: 1.0         # lower -> stronger smoothing when the joint is still
  beta: 0.5               # higher -> less smoothing (less lag) when moving fast
  d_cutoff: 1.0
  preserve_raw_patterns: [Wing]
