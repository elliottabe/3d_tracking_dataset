defaults:
  - _self_
  - paths: hyak
  - anatomy: v1
  - stac: courtship
  - recording: session0
  - detector: vitpose_v3
  - ik: default
  - outputs: default
  - slurm: ckpt_g2

model: ${anatomy.model}
bout_ids: ''      # '' = all; else comma-separated
max_frames: 0     # 0 = all frames per bout
seed: 0

# Stage-limiting for lightweight/QC-only runs (Task 18: scripts/probe_recording.py
# scale probe). Absent/null (default) runs every stage exactly as before --
# byte-identical to pre-Task-18 behaviour. 'triangulate' makes run_bout.py return
# immediately after Stage B (+ optional B2 filter)'s kp2d/kp3d artifacts, before
# scale.json/segment_scales.json/offsets.h5/STAC/polish/outputs/overlay -- used to
# get a robust body-scale + pre-flight quality estimate from many short frame
# windows across a brand-new recording without spending any GPU time on IK.
pipeline:
  stop_after: null   # null | 'triangulate'
  # Accept an existing kp3d.npz even if it was produced under different Stage-B
  # gates. Stage B's gates (view-conf, mask-agreement, wing-collapse,
  # rigid-repair) only run when kp3d.npz is (re)computed, so a resumed run with
  # a stale file silently ignores the current config -- measured on Session0
  # bout 28, where fly1 re-ran with rigid-repair and fly0 kept a pre-gate
  # kp3d.npz and was never reprocessed, with no warning. Default false: the run
  # refuses and names the artifacts to delete.
  allow_stale_kp3d: false

# Minimal inline keys so `paths.data_dir` (and other groups' `${dataset.name}`/
# `${version}` interpolations, e.g. stac/default.yaml's save_path) resolve.
# Deliberately NOT a `- dataset: courtship` defaults entry: that group pulls in
# its own `/stac` and `/preprocessing` defaults, which would conflict with the
# explicit `- stac: courtship` selection above.
dataset:
  name: courtship
  version: v1
version: ${dataset.version}
# paths.save_dir = ${multirun_save_dir:${paths.base_dir},${run_id}} (utils/path_utils.py
# custom resolver); run_id has no default outside configs/config.yaml, which this
# pipeline does not inherit from, so it must be defined here too.
run_id: 'analysis'

# stac/default.yaml's `data_path` interpolates `${preprocessing.input_filename}`,
# but pipeline has no `preprocessing` group (bouts are loaded directly
# from recording.predictions_dir, not via cfg.stac.data_path/io.load_mocap).
# stac_mjx.run_stac -> io.save_data_to_h5 still does a full-config resolve+save,
# so this key must exist even though its value is never read. Not wired to a
# `preprocessing:` defaults group for the same cascade-avoidance reason as
# `dataset` above.
preprocessing:
  input_filename: 'preprocessed_bout_${anatomy.name}_${dataset.name}.h5'

# Trunk-marker Procrustes body-size scale applied to keypoints before STAC (see
# jarvis_jax.tracking.scale). Without it, raw triangulated keypoints are
# ~78x the MuJoCo model's rest-pose scale, which makes the STAC jaxls LM-batch
# Jacobian catastrophically ill-conditioned and the solve stalls. Mirrors
# configs/preprocessing/default.yaml's `scaling` block (trunk path); inline
# (not a defaults-group entry) for the same cascade-avoidance reason as
# `dataset`/`preprocessing` above.
# scale_keypoints: rigid_segment (default, Task 16) measures body scale
# directly from rigid leg-segment lengths (scripts/estimate_recording_scale.py
# rigid_segment_pairs/per_bout_segment_scale) instead of fitting a
# trunk-marker point cloud. It is pose-invariant (a leg-bone's length can't
# change no matter how the fly moves, so it isn't confounded by pose the way
# a Procrustes/norm-ratio cloud-spread fit is) AND it matches the kinematic
# chain the IK actually solves (the LEGS, not the trunk plates) -- measured
# on real data the trunk-derived scale is ~10.2% off the leg-chain scale
# (render the check with scripts/viz/scale_check.py). `estimator` below is
# ignored for this mode
# (a rigid segment's length is measured, not fit; scripts/run_bout.py warns
# and marks scale.json's `estimator` field "ignored (rigid_segment)" rather
# than echoing an unused configured value).
# THIS BLOCK IS SHARED between courtship (num_animals=2) and free-running
# (num_animals=1) bouts -- scripts/run_bout.py has no assay-specific branch
# here, so this default applies to BOTH. Structurally safe for free-running
# too (same rig/anatomy, no sex.json/identity dependency), but it is a real
# behaviour change there as well, not just for courtship.
scaling:
  trunk_keypoints: [Scutellum, WingL_base, WingR_base, Abd_A4, Abd_tip]
  estimator: umeyama       # 'umeyama' | 'norm_ratio' (ignored for scale_keypoints=rigid_segment)
  robust_stat: median      # 'median' | 'mean'
  robust: none             # 'huber' | 'none'
  scale_keypoints: rigid_segment   # 'trunk' | 'all' | 'rigid_segment' (pair 'all' with estimator=norm_ratio)

  # Body scale is per fly per recording: scale.json carries scale_by_fly and
  # run_bout uses the entry for THIS fly. When it is absent both flies get one
  # number -- a real approximation (male 0.011617 vs female 0.011744 on
  # Session0/2025_10_20_13_20_04) that used to happen silently. run_bout now
  # REFUSES unless this is set, and names which cause applies: identity !=
  # canonical (a bout lacks sex.json, so fly0/fly1 is not a stable individual
  # label -- run scripts/apply_id_review.py) or n_bout_flies < 2 (one arbitrary
  # bout-fly defined the recording -- the scale-from-first-bout defect,
  # measured 15.5% low). Set true only to accept a shared scale deliberately.
  allow_shared_scale: false

# Fly sexing + identity canonicalization (jarvis_jax.tracking.sexing). After both
# flies of a courtship bout are processed, the male (larger wing-song CV) is
# canonicalized to fly1 by physically swapping the fly dirs; a per-bout sex.json
# records the decision + confidence. num_animals==1 (free-running) skips this.
# Per-camera SAM3 mask-coverage gate (Task 17, scripts/mask_coverage.py).
# Absent entirely -> OFF (run_bout gates nothing; behaves exactly as before
# this feature). Set here: any frame with fewer than min_views valid-camera
# SAM3 masks for a fly has its triangulated keypoints marked NaN instead of
# being triangulated from too few views, which is ill-conditioned and
# produces garbage (measured: looks like coincident flies / bones flexing
# 20-50% downstream). 4 of a typical 7-camera rig is the point past which
# triangulation stays well-conditioned for the hard wall/occluded poses that
# most need it (>=2 is the bare DLT minimum). Measured failure mode: the
# female (fly0) drops to as few as 3/7 cameras in several Session0 bouts
# (22, 26, 13, 8, 4) while the male (fly1) stays 7/7 in every bout examined
# -- SAM3 correctly reports "not found" per (fly,cam,frame) rather than
# mis-assigning, so this is a real but NOT dominant contributor to bad
# keypoints (coverage-vs-badness r=-0.63 vs 2D-confidence r=-0.85 over 28
# bout-flies -- don't oversell it).
masks:
  min_views: 4
  # Per-view mask-agreement gate: a (frame, camera) view only enters the DLT,
  # and only counts toward min_views, if its predicted keypoints landed on the
  # mask SAM3 found for THIS fly on THIS camera. Distance is measured in the
  # fly's own size (sqrt mask area) so one threshold transfers across cameras
  # and rigs. Measured on Session0/2025_10_20_13_20_04 bout_00028: 0.60
  # fly-lengths through the healthy stretch vs 4.51 while the female's track
  # was dragged onto the male; 3.0 gates 1.3% of healthy frames against 100%
  # of the bad window, and gates the well-tracked male 0.0% of the time.
  # null = off (strict no-op).
  kp_mask_agree_fly_lengths: 3.0

sexing:
  ratio_thr: 1.5      # min CV ratio (max/min) to trust the pose signal
  high_ratio: 2.5     # CV ratio at/above which confidence is 'high' (else 'medium')
  conf_min: 0.2       # per-keypoint confidence gate for a valid splay frame
  min_frames: 20      # min valid frames or wing_song_cv returns nan

# Pre-STAC keypoint smoothing / outlier rejection (jarvis_jax.tracking.filter
# -> utils.keypoint_filter.filter_keypoints), applied to the triangulated kp3d
# before scale/offsets/STAC. Distal leg tips occasionally mistriangulate and jump
# many mm; STAC then bends the leg to chase the outlier -> jittery/curling IK legs.
# Validated on Session0 (male): foot-tip max accel 12.5->0.9 mm, IK leg jitter ~7x
# lower, reprojection accuracy unchanged. Wings are excluded from the confidence /
# bone-length gates so fast wing motion (song) is preserved. Set enabled: false to
# feed raw triangulation straight to STAC (previous behaviour).
filtering:
  enabled: true
  # Keypoints matching these substrings are restored to their RAW triangulation
  # after filtering (legs/body still get the full smoothing). savgol/isolated-
  # spike are not wing-aware and otherwise flatten the male's rapid wing
  # extension/song (~2x wing-speed loss); this keeps wing kinematics intact.
  preserve_raw_patterns: ['Wing']
  confidence:
    enabled: true
    threshold: 0.3
    exclude_keypoint_patterns: ['Wing']
  bone_length:
    enabled: true
    threshold_std: 5.0
    exclude_keypoint_patterns: ['Wing']
  centroid_jump:
    enabled: false
  identity_relink:
    enabled: false
  isolated_spike:
    enabled: true
    threshold_factor: 10.0
    max_iterations: 1
  medfilt_despike:
    enabled: false
  medfilt:
    enabled: false
  interpolation:
    enabled: true
    use_spline: true
    max_edge_extrap_frames: 5
    edge_fit_window: 5
  confidence_smooth:
    enabled: false
  savgol:
    enabled: true
    window_length: 7    # key must be `window_length` (filter_keypoints reads that; `window` is ignored -> default 11)
    polyorder: 2

# Task 20: partial-keypoint-frame acceptance for Stage C's NaN-robust STAC
# solve (scripts/run_bout.py finite_frame_mask/contiguous_segments, around
# NAN_SOLVE_MAX_GAP/NAN_SOLVE_MIN_SEG above). Absent/null (default) is the
# all-or-nothing gate this pipeline has always used -- every one of a frame's
# keypoints must be finite for that frame to enter a solvable segment, and a
# run that does not set this key is byte-identical to before this feature
# existed.
#
# min_keypoints: N relaxes that to "at least N of the K keypoints are
# entirely finite (present in all 3 coords)". This is safe to turn on because
# the IK residual already ignores an absent (NaN) marker per-frame/per-marker
# without contributing to the cost or its gradient (stac_core_jaxls.py's
# marker_cost: `finite = jnp.isfinite(kp)`) -- relaxing the frame gate only
# decides which partial frames are OFFERED to the solver, not how it treats
# an individual missing marker once offered.
# Measured motivation (Task 19, bout_00028 fly0): the tail 505 frames read as
# 100% NaN under the strict gate, yet raw triangulation still recovers a
# partial (>=40/50 keypoint) signal in 18.2% of them -- data the strict gate
# was discarding outright. This does NOT reach zero loss: where coverage
# genuinely bottoms out at 2-3 cameras, full-body DLT is ill-conditioned and
# those frames stay unsolvable regardless of this setting.
#
# Fix round 1: min_keypoints alone only protects the solver's per-marker
# RESIDUAL (already NaN-safe -- see above). It does NOT protect
# stac_mjx/compute_stac.py's per-frame IK warm-start, which reads the root
# keypoint and the four trunk-orientation keypoints (ROOT_OPTIMIZATION_KEYPOINT
# / JAXLS_ORIENTATION_KEYPOINTS in the anatomy config) straight out of the
# array with NO finite check. So run_bout.py's required_keypoint_indices()
# additionally requires those specific keypoints be finite before a partial
# frame is accepted, on top of clearing min_keypoints -- resolved from the
# SAME anatomy-config keys the solver itself uses, not hardcoded here.
# null = off (strict no-op, current behaviour).
nan_solve:
  min_keypoints: null

# Stale-mask invalidation policy (scripts.sync_policy, gates run_bout.py's
# staleness cascade). Production leaves this on: when a recording's sync plan
# changes, pose artifacts derived from the old masks are stale and must
# recompute. Benchmark/A-B runs set this to false so pre-seeded (frozen)
# kp2d/kp3d/... survive and every variant keeps sharing identical 2D inputs
# (scripts/benchmark/run_variant.py).
sync:
  invalidate_stale: true   # false = keep pre-seeded artifacts (benchmark reproducibility)

# Hydra output organization. Mirrors configs/config.yaml's pattern (run.dir tied to a
# stable location + override_dirname exclude_keys) but points at THIS pipeline's own
# predictions dir (${outputs.out}) instead of the STAC ${paths.base_dir}. Without this
# block Hydra defaults to `outputs/${now}/${now}` at the repo root; here the per-run
# config snapshot (.hydra/) + log land inside the predictions dir, co-located with
# offsets.h5 / bouts/. Per-bout parallel/SLURM launchers override
# `hydra.run.dir=${outputs.out}/hydra/bout_<n>` to avoid collisions when several bouts
# write into the same ${outputs.out} concurrently.
hydra:
  job:
    config:
      override_dirname:
        exclude_keys: [paths, version, dataset, anatomy, stac, recording, detector,
                       silhouette, outputs, slurm, note, seed, bout_ids, max_frames]
  run:
    dir: ${outputs.out}/hydra/${run_id}
  sweep:
    dir: ${outputs.out}/hydra/${run_id}
    subdir: bout_${hydra.job.num}

# Per-view wing L/R COLLAPSE gate, applied to the 2-D before triangulation.
# A view whose two wing labels sit on the same wing holds no left/right
# information; permuting them is a no-op, so a cross-view swap search cannot
# repair it (measured: fires on 2/1500 male frames, leaves 11 of 13 jumps).
# Dropping those views for the WING keypoints only is what works.
#
# Measured on Session0 bout 28 (min_views_kept=4):
#   male   flipped-vein frames 11 -> 5, WingL_V12 jumps 13 -> 6, WingL_V13 7 -> 2,
#          frames 300+ unchanged, no new NaNs
#   female 117 -> 118, +1 NaN  (essentially untouched -- see min_views_kept)
#
# OFF by default: it is a real change to the 3-D that every downstream stage
# consumes, so turn it on deliberately.
wing_collapse:
  enabled: false
  # Flag a (frame, view) whose mean |WingL_* - WingR_*| separation, in body
  # lengths, is below abs_floor OR below rel_frac x that camera's OWN median.
  # The relative clause catches a camera that normally resolves the wings and
  # stops (631/857/861: 1.5-2.1 -> 0.3); the floor catches one that never does
  # (855: 0.33 on 94% of frames).
  abs_floor: 0.6
  rel_frac: 0.35
  # REQUIRED GUARD, not book-keeping. A folded-wing fly has both wings genuinely
  # superposed in most views -- anatomy, not detector error -- so the test fires
  # nearly everywhere (female median separations 0.25-0.57; cameras 855/857/861
  # flagged on 99-100% of frames). Masking anyway turned her 117 bad frames into
  # 247 with 88 new all-NaN frames. On a frame where fewer than this many views
  # would survive, NOTHING is masked: an under-determined triangulation is worse
  # than a biased one. Swept 3/4/5; 3 helps the male more (13 -> 4) but wrecks
  # the female, 5 is safe but weaker. 4 is the balance.
  min_views_kept: 4

# RIGID-INVARIANT repair, applied to the triangulated 3-D. Deletes frames whose
# rigid segment length is physically impossible and interpolates the short gap.
#
# Why this and not a length projection: the residual wing defect is ANGULAR --
# a landmark sits a whole wing away, so forcing the right LENGTH slides it along
# a wrong direction (measured: WingL_V12's 13 jumps stayed 13). And the fit
# hides it: the model's wing is rigid, so outputs.h5 reports a perfect vein
# length while qpos[7] swings ~40 deg and the fitted site jumps 13-17 mm against
# a 0.33 mm baseline.
#
# This is NOT smoothing (wings are excluded from Stage B2 to protect the song):
# only frames the invariant FLAGS are touched, every other frame is returned
# byte-identical, and a run longer than max_gap or touching a bout edge is left
# NaN rather than invented.
rigid_repair:
  enabled: false
  # restrict to edges whose endpoints match these substrings ([] = all rigid
  # edges in courtship_skeleton_edges). Wings are the measured failure.
  edges_containing: [Wing]
  rel_tol: 0.5      # flag |L - target|/target > this. The flip is ~350% off and
                    # a healthy vein measures CV ~3%, so 0.5 separates cleanly.
  max_gap: 5        # longer than this is a regime, not a spike -> left NaN
  max_cv: 0.20      # refuse to derive a target from a non-rigid edge (the
                    # female's V12-V13 measures CV 69-123% and gets no target)
  min_conf: 0.5
  min_frames: 50
  also_nan: []      # extra keypoints to drop on a flagged frame

# Post-STAC refinement of WING PITCH against the SAM masks. Wing pitch is 99.6%
# of the marker Jacobian's null direction (per-column sensitivity yaw 0.271 /
# roll 0.344 / pitch 0.042), because each wing body carries only two markers --
# WingX_base maps to the THORAX. Unconstrained, the blade rotates into the
# abdomen. The masks DO contain wing pixels (wing landmarks project inside them
# on 75-91% of frames), and sweeping pitch shows a real silhouette optimum.
# Yaw and roll are NOT touched: yaw carries the song, roll is the
# strongest-observed wing DOF.
# Runs between Stage D's compute_bridges and Stage E (it needs the per-frame
# model->mm bridge to project onto the masks) and writes qpos_wingfit.npz.
# See docs/specs/2026-09-01-wing-orientation-from-masks-design.md
wing_mask_fit:
  # MEASURED AND DELIBERATELY OFF (2026-09-01, bout 28, both flies). This is a
  # decision, not an untried default. The stage gets wing PLACEMENT right --
  # both flies move from ~-8 deg into the measured -20..-40 deg optimum band,
  # wing/abdomen penetration closes 30-74% of the gap to the model's grazing
  # value on BOTH wings of BOTH flies, and the wing-marker residual does not
  # degrade (+1.1% male, -22.5% female) -- and it gets wing FINE MOTION wrong:
  # it DESTROYS the bilaterally phase-locked courtship song in wing pitch
  # (L/R coherence at the song frequency 0.418/0.852 in the control -> 0.038/
  # 0.070 here), and on the female it ADDS oscillation the video does not have.
  # Do not flip this to true without re-measuring against the AMENDED
  # acceptance criterion 1 (a phase-lock test; the old amplitude test scored
  # this config a clean pass on the epoch where the song died).
  # docs/benchmark/2026-09-01-wing-mask-fit/notes.md + the spec's section 8.
  enabled: false
  containment_weight: 0.3
  # MEASURED, Task 5: at coverage_weight == containment_weight the coverage sum
  # (128 targets x 7 cameras of squared raw-px distances) dwarfs the containment
  # sum (100 wing verts, ~79% of them exactly zero) by ~100x, so 0.3/0.3 is
  # effectively coverage-only and the fit gets WORSE on both metrics. The fix is
  # per-target-count normalisation plus huber_delta > 0, not zeroing the term.
  #
  # UNDECIDED (Task 8) -- 0.3 is INHERITED, not chosen. On real data 0.0 and 0.3
  # agree to 3 s.f. on the headline metrics, but the term is not inert: on the
  # FEMALE it moves hp_rms +2.4% and right-wing penetration 2.8% the WRONG way,
  # and at 1.0 her added jitter nearly doubles (do not go there). Its only
  # ground-truth win is at the REST attitude (2.49 -> 1.14 deg with containment)
  # and is offset by an almost equal loss at the EXTENDED attitude
  # (0.53 -> 1.63 deg) -- the attitude the song criterion protects. Alone it is
  # catastrophic at rest (43 deg, worse than doing nothing). If forced to
  # choose, the evidence tips to 0.0. Re-derive it if the mask cost is rescaled.
  coverage_weight: 0.3
  # NOTE the module normalises coverage per (frame, camera) target count by
  # default, so coverage_weight: 0.3 here is ~ the OLD un-normalised 0.03.
  coverage_normalize: true
  # MUST be > 0, whatever coverage_weight ends up being. At huber_delta 0 the
  # chamfer is an unrobustified L2 whose gradient scales with distance, so SAM
  # halo and body-silhouette crescents dominate and the term loses on its own
  # metric. In the synthetic fixture the COMBINED objective improves on both
  # attitudes going from huber 0 to 8: extended 1.88 -> 1.63 deg, rest
  # 1.63 -> 1.14 deg. 8.0 is the measured corner.
  huber_delta: 8.0
  # Body basis for "what the body already explains". Density MATTERS on real
  # masks (stride 20->4 with dilate_px 3->8 recovered 1.3 pt); the synthetic
  # fixture could not show this because there the mask IS the mesh silhouette.
  body_vertex_stride: 4
  dilate_px: 8
  # MEASURED (Task 7/8), and NOT the axis that protects the song. The term is
  # smooth_weight**2 * sum(dq)^2 with dq in RADIANS against a raw-pixel mask
  # cost, so 0.005 is a coefficient of 2.5e-5: no effective temporal coupling,
  # and the fit is independent per frame. Swept 0.5/5/10/20/30/50 on both flies:
  # placement, penetration and residual are FLAT across the whole range, and
  # raising it buys the (retired) amplitude test -- but BOTH ends destroy the
  # bilateral phase lock, and 30 additionally removes 37% of the second song
  # epoch's real dynamics and all 29 of its pulses. Neither 0.005 nor 30 is
  # shippable; the fix is a design change (a slowly-varying pitch correction),
  # not a weight. Value is specific to this cost normalisation.
  smooth_weight: 0.005
  # WHAT THE OPTIMISATION VARIABLE IS -- the axis `smooth_weight` is NOT.
  #   free     one Delta-pitch per FRAME. The configuration every number in
  #            docs/benchmark/2026-09-01-wing-mask-fit/ was measured on, kept as
  #            the default so that negative result stays reproducible. It gets
  #            placement right and fine motion wrong: the mask minimum is broad
  #            (+-10-15 deg) and the cost is independent per frame, so the fit
  #            fills the wing-pitch null direction with its own mask noise and
  #            REPLACES the bilaterally phase-locked courtship song there.
  #   spline   the variable is a KNOT VECTOR `knot_spacing` frames apart and
  #            Delta-pitch is piecewise linear between knots. The song is
  #            preserved BY CONSTRUCTION -- the basis cannot represent a
  #            6.4-frame period -- and the optimiser can no longer chase
  #            per-frame mask noise.
  #   lowpass  solve as `free`, then keep only the slow half of the correction
  #            (zero-phase 4th-order Butterworth at 1/(2*knot_spacing)
  #            cycles/frame). Preserves the song equally well by construction,
  #            but spends the whole solve on content it then discards -- it
  #            exists as the CONTROL that says whether `spline` is better or
  #            merely quieter.
  # CHANGED 2026-09-02 from `free`. `free` is the one mode MEASURED to destroy
  # the bilaterally phase-locked courtship song in wing pitch (L/R coherence at
  # the song frequency 0.85 -> 0.04), so it must not be what you get by turning
  # the stage on. `spline` preserves the song by construction and keeps every
  # placement gain, and is what all four validated bouts actually ran.
  # `free` is still selectable and is required to reproduce spec sections 1-9.
  param_mode: spline
  # Frames between spline knots, and the 1/(2*K) cycles/frame lowpass cutoff.
  # CHANGED 2026-09-02 from 32. Both are far slower than the measured 6.4-FRAME
  # song period, so neither carries song -- but 64 DOMINATES 32 on the hard fly
  # on every axis measured: inside% 92.89 vs 92.80, penetration gap 31.9/41.9 vs
  # 31.1/41.1, residual -23.25% vs -22.85%, knot-rate comb 1.06-1.11x vs
  # 1.13-1.56x, and on the mask-failure stretch its excursion peaks at +47.4 deg
  # against +76.6. A C0 basis leaks 1/f^2 kink energy at the knot rate, and
  # widening the knots is the measured way to suppress it.
  # `frame_chunk` MUST be a multiple of this in spline mode (it keeps the global
  # knot grid uniform across chunks): 256 % 64 == 0, enforced at
  # wing_mask_refine.py:829.
  knot_spacing: 64
  limit_weight: 10.0
  n_steps: 300
  lr: 0.01
  # PERFORMANCE, not a weight: frames per device call. Task 5 measured on a
  # 46 GB card that 256 is what the real bout wants; the module default of 64
  # is safe but slower. Chunking does change the DECOMPOSITION of the joint
  # problem, so two chunk sizes agree only to within the chunk-boundary
  # smoothness anchor (each chunk carries the previous chunk's last refined
  # pose as its `q_prev`), not bit-for-bit. That is why it is excluded from
  # `wing_mask_fit_signature` -- moving to a smaller GPU must not invalidate a
  # good fit -- and why the exclusion is a judgement rather than an identity.
  frame_chunk: 256
  out_hw: [128, 128]
  bbox_margin: 0.4
  n_target_points: 128
  # a frame with fewer than this many present cameras is left at its STAC pose
  min_present_cameras: 3
  # --- THE VALIDITY GATE (2026-09-01). Skipping a badly-tracked fly-frame is a
  # FEATURE, not a workaround: the user's ruling is that this correction is for
  # flies that are WELL TRACKED, and a poorly-tracked female may be left at her
  # marker-solve pose. MEASURED on Session0 bout 28 fly0, whose masks collapse
  # from 15 862 px to 4 882 px over frames 1500-2006 with 47% slivers while
  # remaining `valid` on 90.7% of camera-frames -- which is exactly why
  # min_present_cameras (a count of PRESENT masks) is blind to it.
  #
  # Two signals, and only the second is general: area against that camera's own
  # healthy reference catches the truncated sliver; the fraction of the
  # projected BODY landing inside the mask catches a wrong-fly or merged-fly
  # mask, which has perfectly normal AREA. The result gates the SDF stack (so
  # sliver evidence never enters the objective) AND holds the skipped frames at
  # the STAC pose (which zeroing `present` alone does NOT do in spline/lowpass).
  #
  # NOTE FOR REPRODUCING TASK 7/9: every number in
  # docs/benchmark/2026-09-01-wing-mask-fit/ sections 1-11 predates this gate
  # AND the |dpitch| bound below. BOTH must be turned off --
  # `gate_enabled=false max_dpitch_deg=null` -- and with both off the spline64
  # arm reproduces to 0.028 deg (VERIFIED on bout 28 fly0, whole bout, against
  # the saved redesign arms; the residue is XLA float32 non-determinism).
  # `gate_enabled=false` ALONE does not: the bound fires on 34 frames there and
  # moves the left wing by up to 28.2 deg.
  gate_enabled: true
  # sliver: an area below this fraction of that camera's own reference.
  # MEASURED: on fly0's clean stretch the median area ratio is 0.95 and 0.1% of
  # camera-frames fall under 0.25; on the collapsed stretch 47% do.
  gate_min_area_frac: 0.25
  # pose disagreement: fewer than this fraction of the projected body vertices
  # land inside the mask. The control's own WING inside% drops 86.4 -> 40.2 on
  # the collapsed stretch, which is the signal this generalises.
  gate_min_body_inside: 0.5
  # the reference is a high quantile, not a median: a median is dragged down by
  # a long enough bad stretch, at which point the slivers define "normal" and
  # the gate silently stops firing. p75 survives a bout up to a quarter bad,
  # which the worst measured case (25% of bout 28) exactly is.
  gate_area_ref_pct: 75.0
  # HARD PHYSIOLOGICAL BOUND on |wing pitch change|, degrees. The MODEL's own
  # limits are no constraint -- wing pitch is legal over -72.8..+167.3 deg and
  # the optimiser has been measured travelling most of it on collapsed masks.
  # MEASURED bracket: across all four param_mode arms, on every well-tracked
  # frame of both flies of bout 28, the largest correction is 42.2 deg; the
  # collapsed stretch reaches 71-98 deg. 50 deg is also about the distance from
  # the fitted pose (~-8 deg) to the model's own springref rest (-57.3 deg), so
  # no legitimate placement correction can need more.
  max_dpitch_deg: 50.0
  # cameras to exclude for wings. Cam2012631 has the right wing inside its mask
  # on only 43-46% of frames (Abd_tip 20%), i.e. truncated masks.
  exclude_cameras: [Cam2012631]
