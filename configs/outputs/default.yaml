# @package outputs
# NOTE: no ${now:...} here — that's a Hydra *runtime* resolver that does not
# resolve under a plain hydra.compose() (only under @hydra.main app runs).
# The date stamp is applied by the driver/CLI at run time (Tasks 11/12 pass
# outputs.out=... explicitly), so this composes cleanly under compose() too.
# Canonical per-recording output tree:
#   processed/<assay>/<Session>/<recording-timestamp>/pose/
# ${basename:${recording.session_dir}} = the recording-dir name; this works for
# both the default recording and the job-array sweep (which overrides
# recording.session_dir per recording), so the output always tracks the input.
out: ${paths.processed_root}/${dataset.name}/${recording.name}/${basename:${recording.session_dir}}/pose
overlay: true
overlay_fps: 30
mesh_subset: fps_500+wing        # for output h5 verts
# Standard per-(bout,fly) QC side-by-side video: raw video+SAM mask+2D skeleton |
# MuJoCo IK render + 3D sites. Generated as a pipeline stage (viz.views.sidebyside,
# run as an isolated subprocess to avoid nested-Hydra init) so every run ships a
# visual QC artifact. Capped to sidebyside_frames to bound MuJoCo render cost on
# long bouts. Set sidebyside: false to skip.
sidebyside: true
sidebyside_frames: 300
# Right panel mode passed to `python -m viz sidebyside --right`. "rigcam"
# (default) renders MuJoCo through a camera built from the LEFT panel's own
# calibration -- the rig is orthographic (verified: P[2,:3]==0 for all 7
# cameras) so an orthographic MuJoCo camera matches it exactly, giving a
# genuinely view-matched IK render. "reproj" draws the fitted mesh/sites as
# reprojected POINTS (no MuJoCo render at all) -- cheaper but not what a
# reader expects from "render the IK". "mujoco" renders the model-space
# `track1` camera, which is NOT view-matched to the left panel and, per its
# own help, "cannot be used to judge orientation" -- do not use it.
sidebyside_right: rigcam
# Camera views for the side-by-side, passed to `--views`. Each named view
# becomes ONE ROW of [real camera frame + mask + 2D skeleton | view-matched
# MuJoCo IK render], so the default renders three real views beside three
# matched renders and a bad fit cannot hide behind a single flattering angle.
# Roles (left/top/right) are resolved from the recording's OWN calibration
# geometry by viz.core.rigviews, so this works unchanged on Session0 and
# Session1 despite their different camera sets. Explicit camera names
# (e.g. "Cam2012630,Cam2012855") also work. Set to "" for the old single-view
# render. Cost scales with the number of views; sidebyside_frames still caps
# total frames.
sidebyside_views: left,top,right
