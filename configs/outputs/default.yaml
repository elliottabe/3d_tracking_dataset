# @package outputs
# NOTE: no ${now:...} here — that's a Hydra *runtime* resolver that does not
# resolve under a plain hydra.compose() (only under @hydra.main app runs).
# The date stamp is applied by the driver/CLI at run time (Tasks 11/12 pass
# outputs.out=... explicitly), so this composes cleanly under compose() too.
# Canonical per-recording output tree:
#   processed/<assay>/<Session>/<recording-timestamp>/pose/
# ${basename:${recording.session_dir}} = the recording-dir name; this works for
# both the default recording and the job-array sweep (which overrides
# recording.session_dir per recording), so the output always tracks the input.
out: ${paths.processed_root}/${dataset.name}/${recording.name}/${basename:${recording.session_dir}}/pose
overlay: true
overlay_fps: 30
mesh_subset: fps_500+wing        # for output h5 verts
# Standard per-(bout,fly) QC side-by-side video: raw video+SAM mask+2D skeleton |
# MuJoCo IK render + 3D sites. Generated as a pipeline stage (viz.views.sidebyside,
# run as an isolated subprocess to avoid nested-Hydra init) so every run ships a
# visual QC artifact. Capped to sidebyside_frames to bound MuJoCo render cost on
# long bouts. Set sidebyside: false to skip.
sidebyside: true
sidebyside_frames: 300
