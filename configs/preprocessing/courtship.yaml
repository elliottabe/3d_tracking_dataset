# @package _global_.preprocessing
# Courtship preprocessing variant: multi-fly cleanup. Inherits preprocessing/default.yaml.
# Identity relink runs first (sustained ID swaps), then centroid_jump masks any
# remaining single-frame outliers; nearest_fill backstops NaN runs that would
# otherwise poison STAC; pair_validity flags identity-collapse frames.
defaults:
  - default

filtering:
  confidence:
    threshold: 0.3            # Relaxed from 0.5 — male KP confidence is systematically
                              # lower during courtship (smaller body, frequent occlusion);
                              # 0.5 blanks ~40% of male frame-kps and collapses STAC to NaN.
  identity_relink:
    enabled: true
  centroid_jump:
    enabled: true
    window: 3                 # Mask 3 frames on each side of a jump
    threshold_mm: 1.5         # Tightened from 2.0 for courtship
  nearest_fill:
    enabled: true             # STAC-mjx trajectory LM rejects any step with NaN in the
                              # residual; long edge-NaN runs on occluded male limbs poison
                              # the whole clip. Backstop: LOCF/BOCF per KP after spline.
    min_valid_frac: 0.05      # Skip KPs with <5% finite frames (would plant a phantom).

pair_validity:
  enabled: true
  # Identity-collapse detector: flag frames where fly0/fly1 Scutellum are closer than
  # ~half a Drosophila body length (~1 mm) — the multi-peak tracker can drop one track
  # onto the other when a fly is occluded.
  ground_epsilon_mm: 0.5
  min_pair_separation_mm: 1.0
  colocation_centroid_kp: Scutellum

sex_cleaning:
  enabled: true
