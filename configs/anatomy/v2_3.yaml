  INDIVIDUAL_PART_OPTIMIZATION:
    # T1 coxa has 3 DOFs (abduct/twist/extend); T2/T3 coxa has 1 DOF (extend only).
    # tarsal_claw is a joint name in v2 (unlike v1 where "claw" was body-only).
