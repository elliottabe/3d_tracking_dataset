    #   Abd_A4  kept its y (it must still mark segment A4) and was snapped to the
    #           dorsal surface: z 0.025 -> 0.03941.
    #   Abd_tip sat at y=0.035 but the abdomen_7 mesh ends at y=0.0196 -- it was
    #           floating past the tip. Moved to the mesh's posterior extreme.
    Abd_A4: 0 0.01323 0.03941
    Abd_tip: -0.00272 0.01956 0.0028
