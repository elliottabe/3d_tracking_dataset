# @package _global_.anatomy
# ---------------------------------------------------------------------------
# `anatomy=v2` is an ALIAS for v2_3 -- it composes configs/anatomy/v2_3.yaml.
#
# It used to be a standalone config pointing at fruitfly_v2.1/, which is not
# present under the configured body_model_dir (models/ has fruitfly_v1,
# fruitfly_v2.3, fruitfly_v2_3_ik, fruitfly_cse), so `anatomy=v2` could not
# load at all.
#
# Repointing just its paths at fruitfly_v2_3_ik would have been WORSE than the
# broken state: v2_3 is not v2 with a different XML, it is a retuned config.
# It adds haltere_left/right to end_eff_names, sets M_REG_COEF 1 -> 0, excludes
# different keypoints from the fit, and -- the important part -- re-places the
# marker offsets onto the v2.3 meshes. The old v2 values were inherited from
# v2.1 and are wrong against these meshes; Abd_tip at `0 0.035 0` sat past the
# end of the abdomen_7 mesh (which ends at y=0.0196) and was moved to
# `-0.00272 0.01956 0.0028`. Pairing the 2_3_ik model with those stale offsets
# is exactly the bug v2_3 exists to fix, and it would have failed silently.
#
# Aliasing keeps one source of truth. To resurrect a genuine v2.1 anatomy,
# restore the standalone config AND add fruitfly_v2.1/ to body_model_dir.
# ---------------------------------------------------------------------------
defaults:
  - v2_3
